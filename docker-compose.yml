# Локальная разработка: PostgreSQL. Продакшен-БД живёт на VPS (см. docs/dev.md).
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KUPOL_DB_USER:-kupol}
      POSTGRES_PASSWORD: ${KUPOL_DB_PASSWORD:-kupol}
      POSTGRES_DB: ${KUPOL_DB_NAME:-kupol}
      # ICU-сортировка, чтобы кириллица сортировалась по-русски, как на VPS.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=ru-RU"
    ports:
      - "127.0.0.1:${KUPOL_DB_PORT:-5432}:5432"
    volumes:
      - kupol-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KUPOL_DB_USER:-kupol} -d ${KUPOL_DB_NAME:-kupol}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  kupol-pgdata:
