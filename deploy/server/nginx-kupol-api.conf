# /etc/nginx/conf.d/kupol-api.conf — обратный прокси перед Go API.
# Сначала кладём этот файл (порт 80), затем выпускаем сертификат:
#   sudo certbot --nginx -d api.kupol.vladinc.ru
# certbot сам добавит listen 443 ssl и редирект с http на https.

# WebSocket (чат, доска — этап 6): Connection: upgrade только для запросов с Upgrade
map $http_upgrade $kupol_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.kupol.vladinc.ru;

    # Лимит тела совпадает с Go (MaxBodyBytes = 1 МиБ). Лимит должен быть именно здесь:
    # если Go отвечает 413, не дочитав тело, а nginx уже буферизует его, клиент получит 502.
    client_max_body_size 1m;
    error_page 413 @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Слишком большой запрос"}}';
    }

    # Загрузки (этап 6.1): файл идёт с origin сайта прямо на api-поддомин, мимо PHP-прокси
    # (его php://input у multipart остаётся пустым). Тело — файл до 20 МБ плюс поля формы,
    # поэтому у этого location свой лимит; общие 1m дали бы на загрузке 413.
    # Настройки прокси повторяются: наследуются они от server, а не от соседнего location.
    location ^~ /api/uploads/put/ {
        client_max_body_size 21m;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $kupol_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_request_buffering on;
        proxy_buffering         on;
    }

    location / {
        # proxy_pass БЕЗ URI: запрос уходит к Go ровно в том виде, в каком пришёл.
        # Это важно: подпись PHP-прокси считается по сырому REQUEST_URI, любая перезапись
        # пути (например, слияние слешей или перекодировка %2F) ломает подпись.
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # nginx — крайний узел: адрес клиента берём только из соединения и ПЕРЕЗАПИСЫВАЕМ
        # заголовки. $proxy_add_x_forwarded_for дописывал бы к присланному клиентом значению,
        # и любой клиент подделывал бы свой IP (обход лимитов) заголовком X-Forwarded-For.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $kupol_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # PDF и файлы отдаём потоком, без буферизации на диск
        proxy_request_buffering on;
        proxy_buffering         on;
    }
}
