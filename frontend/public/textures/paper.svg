<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Волокна и зерно бумаги: тихий шум поверх цвета листа, плитка бесшовная (stitchTiles). -->
  <filter id="fibres" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.55" numOctaves="3" seed="7" stitchTiles="stitch" result="grain" />
    <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.29  0 0 0 0 0.18  0 0 0 0.9 -0.32" />
  </filter>
  <filter id="cloud" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="3" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.28  0 0 0 0.5 -0.18" />
  </filter>
  <rect width="320" height="320" filter="url(#cloud)" opacity="0.55" />
  <rect width="320" height="320" filter="url(#fibres)" opacity="0.5" />
</svg>
