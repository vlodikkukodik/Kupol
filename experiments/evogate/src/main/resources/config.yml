# EvoGate — капча и авторизация

storage:
  # sqlite или mysql
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: evoday
    user: root
    password: ''
    params: 'useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8'

captcha:
  # new — только для незарегистрированных, always — при каждом входе, off — выключена
  # (во время атаки и после проваленной проверки антибота капча показывается всем)
  mode: new
  # от 3 до 6 символов
  length: 5
  # на сколько блоков от игрока висит панель 4x2
  distance: 5
  attempts: 3
  # секунд на ввод капчи
  timeout: 60

auth:
  # секунд на вход/регистрацию после капчи
  timeout: 90
  attempts: 5
  password-min: 6
  password-max: 32
  # сколько аккаунтов можно зарегистрировать с одного IP (0 — без лимита)
  max-accounts-per-ip: 3
  nickname-regex: '^[a-zA-Z0-9_]{3,16}$'
  # минут, в течение которых повторный вход с того же IP не требует пароля (0 — выключено)
  session-minutes: 30
  # команды, доступные до входа
  allowed-commands: [login, l, register, reg]
  # на сколько блоков выше лимита постройки поднимать игрока до входа
  sky-height: 60
  # прятать неавторизованного игрока от остальных и давать слепоту
  hide-unauthed: true

# куда телепортировать после входа
after-login:
  # back — туда, где игрок стоял до входа; location — на точку ниже
  mode: back
  # true — на точку только после регистрации, а при обычном входе возвращать назад
  only-after-register: false
  location:
    world: world
    x: 0.5
    y: 100
    z: 0.5
    yaw: 0
    pitch: 0

antibot:
  # сколько раз можно зайти с одного IP за минуту (0 — без лимита)
  joins-per-ip-per-minute: 6
  # сколько неавторизованных игроков может одновременно висеть с одного IP
  unauthed-per-ip: 2

  # игрок сначала немного падает в небе, сервер сверяет движение с физикой майнкрафта.
  # простые боты шлют неправильные координаты или не двигаются вовсе
  gravity-check:
    enabled: false
    # captcha — показать капчу даже зарегистрированному, kick — выкинуть
    fail-action: captcha
    # секунд ждать, пока клиент начнёт падать (медленные клиенты дольше грузят мир)
    wait: 10

  # режим атаки: если за минуту зашло больше новых (незарегистрированных) игроков, чем limit,
  # капча включается для всех, а новых пускает не больше allow-new в минуту
  attack:
    new-players-per-minute: 20
    allow-new: 5
    # сколько минут держать режим после последнего всплеска
    duration: 5
