# Почта сервера: свои ящики Vladhost и прежняя отправка с самого сервера. Файл ведёт deploy/prepare-mail.sh (бэкап прежнего шаблона и откат —
# в /root/vladhost-mail-backup). Списки доменов, ящиков и алиасов пишет панель через исполнитель (deploy/bin/mail-sync.py).
#
# Что сохранено от прежней настройки: приём и отправка с 127.0.0.1 без пароля (локальные приложения), доставка системным пользователям
# (/var/mail), trusted_users = www-data, порты 25, 465 (TLS сразу) и 587 (STARTTLS).

# Имя сервера в приветствии SMTP (EHLO) должно совпадать с PTR-записью и адресом сертификата: prepare-mail.sh подставляет сюда почтовый хост,
# а прежнее системное имя остаётся среди локальных доменов, чтобы почта на него по-прежнему доставлялась.
primary_hostname = @MAIL_HOST@
# Секрет подписи адресов SRS (пересылка без потери SPF): создаётся при подготовке сервера, читает только exim.
SRS_SECRET = ${readfile{/etc/vladhost/mail/srs_secret}{}}
# Проверка вирусов (clamd) и спама (rspamd) у входящей почты. Служб может не быть (тогда письма проходят без проверки, а в журнал пишется причина).
av_scanner = clamd:/var/run/clamav/clamd.ctl
spamd_address = 127.0.0.1 11333 variant=rspamd

domainlist local_domains = @ : localhost : @SYSTEM_HOSTNAME@ : lsearch;/etc/vladhost/mail/domains
domainlist vladhost_domains = lsearch;/etc/vladhost/mail/domains
domainlist relay_to_domains =
hostlist relay_from_hosts = 127.0.0.1 : ::1

exim_user = Debian-exim
exim_group = Debian-exim
trusted_users = www-data
never_users = root
keep_environment =

local_interfaces = <; ::0 ; 0.0.0.0
daemon_smtp_ports = 25 : 465 : 587
tls_on_connect_ports = 465
tls_advertise_hosts = *
tls_certificate = ${if exists{/etc/vladhost/mail/tls/fullchain.pem}{/etc/vladhost/mail/tls/fullchain.pem}{/etc/exim4/ssl/exim.crt}}
tls_privatekey = ${if exists{/etc/vladhost/mail/tls/privkey.pem}{/etc/vladhost/mail/tls/privkey.pem}{/etc/exim4/ssl/exim.key}}

message_size_limit = 25M
host_lookup = *
rfc1413_hosts = *
rfc1413_query_timeout = 0s
ignore_bounce_errors_after = 2d
timeout_frozen_after = 7d
smtp_accept_max_per_host = 20
smtp_accept_queue_per_connection = 100

log_selector = +all_parents +lost_incoming_connection +received_sender +received_recipients +tls_cipher +tls_peerdn +tls_sni +smtp_confirmation +smtp_syntax_error +smtp_protocol_error

acl_smtp_mail = acl_check_mail
acl_smtp_rcpt = acl_check_rcpt
acl_smtp_data = acl_check_data
acl_smtp_dkim = acl_check_dkim
acl_not_smtp = acl_check_not_smtp

begin acl

acl_check_mail:
  # С авторизацией отправлять можно только от адресов своего домена: ящик одного клиента не выдаёт себя за домен другого.
  deny authenticated = *
       !senders = :
       condition = ${if eq{${domain:$authenticated_id}}{${domain:$sender_address}}{no}{yes}}
       message = Sender address does not belong to the authenticated account
  accept

acl_check_not_smtp:
  accept

acl_check_rcpt:
  accept hosts = :

  deny message = Restricted characters in address
       domains = +local_domains
       local_parts = ^[.] : ^.*[@%!/|]

  deny message = Restricted characters in address
       domains = !+local_domains
       local_parts = ^[./|] : ^.*[@%!] : ^.*/\\.\\./

  # Локальные приложения сервера: как и раньше, без пароля и без проверок.
  accept hosts = +relay_from_hosts
         control = submission/sender_retain

  # Извне нельзя выдавать себя за наш домен без авторизации.
  deny !authenticated = *
       condition = ${if match_domain{$sender_address_domain}{+vladhost_domains}{yes}{no}}
       message = Sender domain is served by this server: authenticate to send from it

  accept local_parts = postmaster
         domains = +local_domains

  require verify = sender

  # Авторизованные клиенты: не больше 300 писем в час с ящика.
  deny authenticated = *
       ratelimit = 300 / 1h / strict / $authenticated_id
       message = Sending rate limit exceeded ($sender_rate messages per hour)

  accept authenticated = *
         control = submission/domain=

  require message = relay not permitted
          domains = +local_domains

  require verify = recipient

  accept

acl_check_data:
  # Письма своих клиентов (с паролем) и приложений самого сервера не проверяются: проверяется только то, что пришло снаружи.
  accept authenticated = *
  accept hosts = +relay_from_hosts

  # Вирус: отказ прямо в SMTP-сессии, отправитель получает уведомление от своего сервера. Если clamd не отвечает, письмо не теряется.
  deny malware = */defer_ok
       message = This message contains a virus ($malware_name) and was rejected
       log_message = virus $malware_name from $sender_address to $recipients

  # Спам: rspamd оценивает письмо (SPF, DKIM, DMARC, содержимое, обучение по папке «Спам»). Условие spam лишь запускает проверку (само оно в этой связке
  # всегда «ложь»), решение принимается по оценке $spam_score_int (баллы, умноженные на 10): от 6 — заголовок X-Spam: Yes (dovecot кладёт такие письма
  # в «Спам»), от 15 — отказ. Если rspamd не отвечает, оценки нет и письмо проходит.
  warn spam = nobody/defer_ok
  warn condition = ${if and{{def:spam_score_int}{>={$spam_score_int}{60}}}{yes}{no}}
       add_header = X-Spam: Yes
  warn condition = ${if def:spam_score{yes}{no}}
       add_header = X-Spam-Score: $spam_score
  deny condition = ${if and{{def:spam_score_int}{>={$spam_score_int}{150}}}{yes}{no}}
       message = Message rejected as spam
       log_message = spam score $spam_score from $sender_address to $recipients
  accept

acl_check_dkim:
  warn dkim_status = fail
       logwrite = DKIM verification failed for $dkim_cur_signer: $dkim_verify_reason
  warn dkim_status = pass
       add_header = :at_start:Authentication-Results: $primary_hostname; dkim=pass header.d=$dkim_cur_signer
  accept

begin routers

# --- SRS: уведомления о недоставке для пересланных писем возвращаются исходному отправителю ---
vladhost_srs:
  driver = redirect
  senders = :
  domains = +local_domains
  condition = ${if inbound_srs {$local_part}{SRS_SECRET}}
  data = $srs_recipient

# --- наши домены: ящик, пересылка, общий ящик домена, иначе отказ ---
vladhost_mailbox:
  driver = accept
  domains = +vladhost_domains
  local_part_suffix = +*
  local_part_suffix_optional
  condition = ${lookup{$local_part@$domain}lsearch{/etc/vladhost/mail/mailboxes}{yes}{no}}
  transport = vladhost_lmtp

vladhost_alias:
  driver = redirect
  domains = +vladhost_domains
  local_part_suffix = +*
  local_part_suffix_optional
  data = ${lookup{$local_part@$domain}lsearch{/etc/vladhost/mail/aliases}}
  qualify_preserve_domain

vladhost_catchall:
  driver = redirect
  domains = +vladhost_domains
  data = ${lookup{*@$domain}lsearch{/etc/vladhost/mail/aliases}}
  qualify_preserve_domain

vladhost_unknown:
  driver = redirect
  domains = +vladhost_domains
  allow_fail
  data = :fail: Unknown user
  no_more

# --- всё остальное ---
dnslookup:
  driver = dnslookup
  domains = ! +local_domains
  transport = remote_smtp
  ignore_target_hosts = 0.0.0.0 : 127.0.0.0/8
  self = pass
  no_more

system_aliases:
  driver = redirect
  allow_fail
  allow_defer
  data = ${lookup{$local_part}lsearch{/etc/aliases}}
  file_transport = address_file
  pipe_transport = address_pipe

localuser:
  driver = accept
  check_local_user
  transport = local_delivery
  cannot_route_message = Unknown user

begin transports

remote_smtp:
  driver = smtp
  # SRS: переслали чужое письмо (алиас или переадресация ящика) — конвертный отправитель переписывается на наш адрес, иначе получатель отклонит письмо
  # по SPF отправителя. Письма самих клиентов и приложений сервера остаются как есть.
  return_path = ${if and{{!eq{$sender_address}{}}{!match_domain{$sender_address_domain}{+local_domains}}{!def:sender_host_authenticated}{or{{match_domain{$original_domain}{+vladhost_domains}}{eq{$originator_uid}{5000}}}}}{${srs_encode{SRS_SECRET}{$return_path}{@MAIL_HOST@}}}{$return_path}}
  # Подпись DKIM ключом домена отправителя; у домена без ключа письмо уходит без подписи.
  dkim_domain = ${if exists{/etc/vladhost/mail/dkim/${sender_address_domain}.key}{$sender_address_domain}{}}
  dkim_selector = vh1
  dkim_private_key = /etc/vladhost/mail/dkim/${sender_address_domain}.key

vladhost_lmtp:
  driver = lmtp
  socket = /var/run/dovecot/lmtp
  batch_max = 20

local_delivery:
  driver = appendfile
  file = /var/mail/$local_part_data
  delivery_date_add
  envelope_to_add
  return_path_add
  group = mail
  mode = 0660
  mode_fail_narrower = false

address_pipe:
  driver = pipe
  return_output

address_file:
  driver = appendfile
  delivery_date_add
  envelope_to_add
  return_path_add

begin retry

*  *  F,2h,15m; G,16h,1h,1.5; F,4d,6h

begin rewrite

begin authenticators

# Проверку паролей делает dovecot; только по TLS.
plain_dovecot:
  driver = dovecot
  public_name = PLAIN
  server_socket = /var/run/dovecot/auth-client
  server_set_id = $auth1
  server_advertise_condition = ${if def:tls_in_cipher}

login_dovecot:
  driver = dovecot
  public_name = LOGIN
  server_socket = /var/run/dovecot/auth-client
  server_set_id = $auth1
  server_advertise_condition = ${if def:tls_in_cipher}
