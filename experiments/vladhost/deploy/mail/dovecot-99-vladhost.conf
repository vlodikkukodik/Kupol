# Виртуальные ящики Vladhost (файл ведёт deploy/prepare-mail.sh). Системные пользователи (PAM) продолжают работать: проверки идут по порядку,
# у пользователей вида «ящик@домен» системный passdb ничего не находит, и дело доходит до нашего файла.
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = username_format=%u /etc/vladhost/mail/dovecot-users
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/vladhost/mail/dovecot-users
}

ssl = yes
ssl_cert = </etc/vladhost/mail/tls/fullchain.pem
ssl_key = </etc/vladhost/mail/tls/privkey.pem
ssl_min_protocol = TLSv1.2

mail_plugins = $mail_plugins quota
protocol imap {
  mail_plugins = $mail_plugins imap_quota imap_sieve
}
protocol lmtp {
  mail_plugins = $mail_plugins sieve
}
protocols = $protocols sieve

# Стандартные папки создаются сразу: Roundcube и правило «спам в Спам» рассчитывают на них.
namespace inbox {
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
}

# ManageSieve (порт 4190, только с шифрованием): правила фильтрации из Roundcube и почтовых программ.
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

plugin {
  # Порядок такой: сначала общее правило сервера (спам → «Спам»), затем то, что задано в панели (автоответчик и пересылка), затем личные правила
  # пользователя (ManageSieve).
  sieve_before = /etc/vladhost/mail/sieve/before.d
  sieve_before2 = /var/vmail/%d/%n/sieve-panel
  sieve = file:~/sieve;active=~/.dovecot.sieve
  sieve_plugins = sieve_imapsieve sieve_extprograms
  sieve_global_extensions = +vnd.dovecot.pipe +vnd.dovecot.environment
  sieve_pipe_bin_dir = /usr/local/lib/vladhost/sieve-pipe
  sieve_max_redirects = 5
  # Пересылка из sieve уходит от адреса самого ящика (а не от служебного vmail@…): действуют SPF и DKIM домена ящика, уведомления о недоставке приходят в ящик.
  sieve_redirect_envelope_from = recipient
  sieve_vacation_min_period = 1h
  sieve_vacation_default_period = 1d
  sieve_vacation_max_period = 30d

  # Обучение rspamd: письмо перенесли в «Спам» — это спам, вынесли из «Спама» (не в корзину) — не спам.
  imapsieve_mailbox1_name = Junk
  imapsieve_mailbox1_causes = COPY APPEND
  imapsieve_mailbox1_before = file:/etc/vladhost/mail/sieve/learn-spam.sieve
  imapsieve_mailbox2_name = *
  imapsieve_mailbox2_from = Junk
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/etc/vladhost/mail/sieve/learn-ham.sieve

  quota = maildir:User quota
  quota_status_success = DUNNO
  quota_status_nouser = DUNNO
  quota_status_overquota = "552 5.2.2 Mailbox is full"
}

# Сокеты для exim: проверка пароля при отправке и доставка в ящики.
service auth {
  unix_listener auth-client {
    mode = 0660
    user = Debian-exim
  }
}
service lmtp {
  unix_listener lmtp {
    mode = 0600
    user = Debian-exim
  }
}
