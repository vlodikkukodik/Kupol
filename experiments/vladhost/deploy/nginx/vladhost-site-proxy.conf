# Общая часть server-блоков сайтов пользователей (адрес на нашем домене и свои домены): TLS-параметры задаёт
# сам блок. Файлы отдаёт веб-шлюз (vladhost-web, 127.0.0.1:8091): он понимает .htaccess и сам показывает страницы
# по умолчанию. nginx держит TLS и сжатие и перехватывает только «шлюз недоступен».
# Тела запросов нужны сайтам с PHP и приложениями (формы, загрузки); статике они безразличны. Шлюз сам ограничивает тело 64 МБ.
client_max_body_size 64m;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 512;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml
           application/rss+xml application/atom+xml image/svg+xml application/wasm font/ttf font/otf
           application/vnd.ms-fontobject;

location / {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    # WebSocket приложений: при заголовке Upgrade соединение переключается, иначе — обычное (keep-alive к шлюзу).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $vh_connection_upgrade;
    proxy_set_header Host $host;
    # Заголовок перезаписывается, а не дополняется: клиент не подделает адрес для ограничения попыток входа.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 70s; # PHP и приложениям дано до 60 секунд
    proxy_send_timeout 70s;
}

error_page 502 503 504 /__vh_down.html;
location = /__vh_down.html {
    internal;
    root /opt/vladhost/pages;
}
