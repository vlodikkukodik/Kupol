# Webmail (Roundcube), порт 443. Подключается после выпуска сертификата webmail.vladinc.ru (prepare-webmail.sh).
# Наружу смотрит только каталог public_html: в нём index.php (приложение) и static.php (стили, скрипты, картинки).

limit_req_zone $binary_remote_addr zone=vhwebmail:10m rate=120r/m;

# Пароли ящиков здесь вводятся в форму, а не в адрес, но строку запроса всё равно не пишем: в ней бывают темы писем и поисковые фразы.
log_format vhwebmail '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 443 ssl;
    http2 on;
    server_name webmail.vladinc.ru;

    ssl_certificate     /etc/letsencrypt/live/webmail.vladinc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail.vladinc.ru/privkey.pem;

    access_log /var/log/nginx/vladhost-webmail.access.log vhwebmail;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # X-Frame-Options ставит само приложение

    root /opt/roundcube/public_html;
    client_max_body_size 30m; # вложения: сервер принимает письма до 25 МБ

    # Вход и все действия — один index.php; параметры (?_task=…) остаются в строке запроса.
    location = / {
        limit_req zone=vhwebmail burst=60 nodelay;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/vhwebmail.sock;
        fastcgi_param SCRIPT_FILENAME /opt/roundcube/public_html/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }
    location = /index.php {
        limit_req zone=vhwebmail burst=60 nodelay;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/vhwebmail.sock;
        fastcgi_param SCRIPT_FILENAME /opt/roundcube/public_html/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }

    # Стили, скрипты и картинки отдаёт static.php (он сам проверяет путь и тип файла).
    location ~ ^/static\.php(/.*)?$ {
        fastcgi_split_path_info ^(/static\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/vhwebmail.sock;
        fastcgi_param SCRIPT_FILENAME /opt/roundcube/public_html/static.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        expires 30d;
    }
    location = /favicon.ico {
        rewrite ^ /static.php/skins/elastic/images/favicon.ico last;
    }

    # Всё остальное (installer.php, скрытые файлы) не существует для внешнего мира.
    location / { return 404; }
}
