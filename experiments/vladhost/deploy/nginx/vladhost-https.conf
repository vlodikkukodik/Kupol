# Vladhost, порт 443. Подключать после выпуска сертификата app.vladinc.ru.

# --- Панель ---
server {
    listen 443 ssl;
    http2 on;
    server_name app.vladinc.ru;

    ssl_certificate     /etc/letsencrypt/live/app.vladinc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vladinc.ru/privkey.pem;

    root /opt/vladhost/frontend;
    index index.html;

    # HSTS без includeSubDomains: на соседних поддоменах живут чужие проекты.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Naive UI и CodeMirror добавляют стили на лету, поэтому style-src 'unsafe-inline'; скрипты — только свои.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        # Заголовок перезаписывается, а не дополняется: клиент не может подделать свой IP для rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 520m; # квота диска 500 МБ + служебные части multipart
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / { try_files $uri /index.html; }
}

# --- Сайты пользователей ---
# Файлы отдаёт веб-шлюз (vladhost-web, 127.0.0.1:8091): он понимает .htaccess и сам показывает страницы по
# умолчанию (пустой сайт, 403, 404 и другие ошибки) — их нет в папке пользователя. nginx держит TLS, сжатие
# и перехватывает только «шлюз недоступен».
# Сертификат выбирается по SNI из /etc/vladhost/certs/{host}: его кладёт deploy-hook certbot
# (deploy/bin/cert-hook.sh). Значение $ssl_server_name гарантированно из [a-z0-9.-], потому что сервер выбран
# по regex ниже; чужие каталоги через SNI не открыть.
server {
    listen 443 ssl;
    http2 on;
    server_name ~^(?<site>[a-z0-9-]+)\.(?<user>[a-z0-9-]+)\.vladinc\.ru$;

    ssl_certificate     /etc/vladhost/certs/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/vladhost/certs/$ssl_server_name/privkey.pem;

    include /etc/nginx/snippets/vladhost-site-proxy.conf;
}
