# Веб-клиент баз данных (Adminer), порт 443. Подключается после выпуска сертификата db.vladinc.ru (prepare-db.sh).
# Всё отдаёт один index.php: он меняет одноразовый токен из панели на вход и пускает Adminer только к нашим серверам СУБД.

limit_req_zone $binary_remote_addr zone=vhadminer:10m rate=60r/m;

# В журнал пишем путь без строки запроса: в ней токен входа.
log_format vhdb '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 443 ssl;
    http2 on;
    server_name db.vladinc.ru;

    ssl_certificate     /etc/letsencrypt/live/db.vladinc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db.vladinc.ru/privkey.pem;

    access_log /var/log/nginx/vladhost-db.access.log vhdb;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    root /opt/vladadminer;
    client_max_body_size 64m; # импорт SQL-дампа; база всё равно ограничена своим лимитом

    location / {
        limit_req zone=vhadminer burst=40 nodelay;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/vhadminer.sock;
        fastcgi_param SCRIPT_FILENAME /opt/vladadminer/index.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
    }
}
