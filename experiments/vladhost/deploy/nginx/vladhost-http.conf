# Vladhost, порт 80: проверка Let's Encrypt (HTTP-01) и переход на https.
# Существующие vhost'ы (kupol, registro) не затрагиваются: у них точные имена, а они приоритетнее regex.

# Для WebSocket приложений сайтов: пустое значение оставляет обычное соединение.
map $http_upgrade $vh_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name app.vladinc.ru;

    location /.well-known/acme-challenge/ { root /var/www/vladhost-acme; }
    location / { return 301 https://$host$request_uri; }
}

# FTP-сервер живёт в самой панели (порт 2121), nginx здесь нужен только для выпуска его сертификата.
server {
    listen 80;
    server_name ftp.vladinc.ru;

    location /.well-known/acme-challenge/ { root /var/www/vladhost-acme; }
    location / { return 404; }
}

# Почтовый сервер (SMTP, IMAP): здесь нужен только выпуск сертификата mail.vladinc.ru.
server {
    listen 80;
    server_name mail.vladinc.ru;

    location /.well-known/acme-challenge/ { root /var/www/vladhost-acme; }
    location / { return 404; }
}

# Webmail (Roundcube): здесь нужен только выпуск сертификата, дальше работает vladhost-webmail.conf.
server {
    listen 80;
    server_name webmail.vladinc.ru;

    location /.well-known/acme-challenge/ { root /var/www/vladhost-acme; }
    location / { return 301 https://$host$request_uri; }
}

# Веб-клиент баз данных (Adminer): здесь нужен только выпуск сертификата, дальше работает vladhost-db.conf.
server {
    listen 80;
    server_name db.vladinc.ru;

    location /.well-known/acme-challenge/ { root /var/www/vladhost-acme; }
    location / { return 301 https://$host$request_uri; }
}

# Сайты пользователей: {site}.{user}.vladinc.ru и их поддомены {метка}.{site}.{user}.vladinc.ru. Класс символов узкий намеренно —
# значения попадают в путь к файлам.
server {
    listen 80;
    server_name ~^(?:[a-z0-9-]+\.)?(?<site>[a-z0-9-]+)\.(?<user>[a-z0-9-]+)\.vladinc\.ru$;

    location /.well-known/acme-challenge/ { root /var/www/vladhost-acme; }
    location / { return 301 https://$host$request_uri; }
}
