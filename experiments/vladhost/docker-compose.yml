# Локальная разработка: PostgreSQL на порту 5433 (5432 занят соседним проектом).
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vladhost
      POSTGRES_PASSWORD: vladhost
      POSTGRES_DB: vladhost
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vladhost-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vladhost -d vladhost"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MariaDB для тестов раздела «Базы данных» (на бою пользовательские базы живут в отдельных серверах, см. deploy/README.md).
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: vladhost
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  vladhost-pgdata:
